<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CDF Tracker">
<meta name="theme-color" content="#0f172a">
<title>CDF Tracker</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b;
    --line:#e2e8f0; --today:#fef9c3; --todayLine:#facc15;
    --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
    --headerBg:rgba(241,245,249,.92);
    --primary:#0f172a; --primary-fg:#ffffff;
  }
  /* Palette dark — attiva quando il sistema preferisce dark e l'utente non ha forzato light */
  @media (prefers-color-scheme: dark){
    :root:not(.light){
      --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --muted:#94a3b8;
      --line:#334155; --today:rgba(250,204,21,.12); --todayLine:#ca8a04;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
      --headerBg:rgba(15,23,42,.92);
      --primary:#f1f5f9; --primary-fg:#0f172a;
    }
  }
  /* Palette dark — forzata via toggle manuale */
  :root.dark{
    --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --muted:#94a3b8;
    --line:#334155; --today:rgba(250,204,21,.12); --todayLine:#ca8a04;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
    --headerBg:rgba(15,23,42,.92);
    --primary:#f1f5f9; --primary-fg:#0f172a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px;margin:0 auto;padding:12px 12px 60px;}

  header{position:sticky;top:0;z-index:20;background:var(--headerBg);
    backdrop-filter:saturate(180%) blur(8px);padding:8px 12px 6px;margin:-12px -12px 8px;
    border-bottom:1px solid var(--line);}
  .title{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .title h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;}
  .title-right{display:flex;align-items:center;gap:8px;}
  .overall{font-size:13px;color:var(--muted);font-weight:600;}
  .overall b{font-size:15px;}
  .sync{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
    color:var(--muted);background:var(--card);border:1px solid var(--line);
    padding:5px 9px;border-radius:99px;cursor:pointer;}
  .dot{width:8px;height:8px;border-radius:99px;background:#94a3b8;flex:0 0 auto;}
  .dot.ok{background:#22c55e;} .dot.saving{background:#f59e0b;animation:pulse 1s infinite;}
  .dot.error{background:#ef4444;} .dot.off{background:#94a3b8;}
  @keyframes pulse{50%{opacity:.35;}}

  .nav{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .nav .arrow{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);font-size:20px;font-weight:700;color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
  .nav .arrow:active{background:var(--line);}
  .weeklabel{flex:1;text-align:center;font-weight:700;font-size:15px;line-height:1.15;}
  .weeklabel small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:1px;}
  .today-btn{height:40px;padding:0 14px;border-radius:12px;border:0;background:var(--primary);
    color:var(--primary-fg);font-weight:700;font-size:13px;cursor:pointer;flex:0 0 auto;}
  .today-btn:active{opacity:.85;}
  .hidden{display:none!important;}

  .tabs{display:flex;gap:6px;margin-top:8px;}
  .tab{flex:1;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
  .tab.active{background:var(--primary);color:var(--primary-fg);border-color:var(--primary);}
  .tab.icon{flex:0 0 46px;}

  .section{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
    margin-bottom:12px;overflow:hidden;border:1px solid var(--line);}
  .sec-head{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;}
  .sec-emoji{font-size:20px;line-height:1;}
  .sec-name{font-weight:700;font-size:15px;flex:1;}
  .sec-pct{font-weight:800;font-size:14px;}
  .bar{height:7px;border-radius:99px;background:var(--line);margin:0 14px 10px;overflow:hidden;}
  .bar > i{display:block;height:100%;border-radius:99px;transition:width .25s ease,background .25s ease;}

  table{width:100%;border-collapse:collapse;}
  thead th{font-size:11px;color:var(--muted);font-weight:700;padding:4px 0 6px;text-align:center;}
  thead th.lbl{text-align:left;padding-left:14px;}
  thead th .dnum{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:1px;}
  thead th.todaycol, td.todaycol{background:var(--today);}
  thead th.todaycol{border-top:2px solid var(--todayLine);}
  tbody td{padding:3px 0;text-align:center;border-top:1px solid var(--line);}
  tbody td.lbl{text-align:left;padding-left:14px;font-size:13px;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1px;width:38%;}
  tbody td.rowpct{font-size:11px;font-weight:800;padding-right:10px;width:34px;}
  .tag{font-size:9px;color:var(--muted);font-weight:700;border:1px solid var(--line);
    border-radius:5px;padding:1px 4px;margin-left:5px;vertical-align:middle;}

  .cell{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);
    background:var(--card);display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;color:transparent;font-size:15px;font-weight:800;margin:0 auto;
    transition:transform .05s ease;}
  .cell:active{transform:scale(.88);}
  .cell.on{color:#fff;}
  .celldis{width:30px;height:30px;border-radius:8px;border:1.5px dashed var(--line);
    background:var(--bg);display:inline-flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;margin:0 auto;}
  .weekcell{display:flex;align-items:center;justify-content:center;gap:8px;}
  .weekcell small{color:var(--muted);font-size:11px;font-weight:700;}

  .daycard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
    border:1px solid var(--line);padding:12px 14px;margin-bottom:12px;}
  .daycard h3{margin:0 0 10px;font-size:14px;}
  .daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;}
  .daygrid .d{font-size:11px;}
  .daygrid .d .lab{color:var(--muted);font-weight:700;margin-bottom:4px;}
  .daygrid .d .ring{font-weight:800;font-size:13px;}
  .daygrid .d.is-today .lab{color:#a16207;}
  .daygrid .d.is-today{background:var(--today);border-radius:10px;padding:4px 0;}

  .hcard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
    border:1px solid var(--line);padding:14px;margin-bottom:12px;}
  .hcard h3{margin:0 0 12px;font-size:15px;}
  .hcard p.sub{margin:-6px 0 12px;font-size:12px;color:var(--muted);line-height:1.45;}
  .chart{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:6px;}
  .chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
  .chart .colbar{width:100%;max-width:42px;border-radius:8px 8px 0 0;
    min-height:3px;display:flex;align-items:flex-start;justify-content:center;}
  .chart .colpct{font-size:10px;font-weight:800;color:#fff;padding-top:3px;}
  .chart .collabel{font-size:10px;color:var(--muted);font-weight:600;text-align:center;line-height:1.1;}

  .hm-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .hm{border-collapse:collapse;width:100%;}
  .hm th{font-size:10px;color:var(--muted);font-weight:700;padding:3px 2px;white-space:nowrap;}
  .hm th.lbl,.hm td.lbl{text-align:left;padding-right:8px;font-size:12px;font-weight:500;
    color:var(--ink);white-space:nowrap;position:sticky;left:0;background:var(--card);}
  .hm td{padding:2px;}
  .hm .sub td{font-weight:800;font-size:11px;color:var(--ink);padding-top:8px;}
  .hm .swatch{width:26px;height:22px;border-radius:5px;background:var(--line);margin:0 auto;
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0;}

  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .field input[type=text]{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;
    padding:0 12px;font-size:15px;background:var(--card);color:var(--ink);}
  .btn{height:42px;padding:0 16px;border-radius:10px;border:0;font-weight:700;font-size:14px;cursor:pointer;}
  .btn.primary{background:var(--primary);color:var(--primary-fg);}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .btn:active{opacity:.85;}
  .row-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .status-msg{font-size:13px;font-weight:600;margin-top:10px;padding:10px 12px;border-radius:10px;}
  .status-msg.ok{background:#dcfce7;color:#166534;}
  .status-msg.err{background:#fee2e2;color:#991b1b;}
  .status-msg.info{background:#e0f2fe;color:#075985;}
  .rename-list{display:flex;flex-direction:column;gap:6px;}
  .rename-row{display:flex;align-items:center;gap:8px;}
  .rename-row .ic{font-size:15px;width:20px;text-align:center;flex:0 0 auto;}
  .rename-row input{flex:1;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:14px;background:var(--card);color:var(--ink);}
  .rename-row .movebtn{width:36px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:13px;font-weight:800;color:var(--ink);cursor:pointer;flex:0 0 auto;}
  .rename-row .movebtn:disabled{opacity:.3;cursor:default;}
  .rename-row .movebtn:active:not(:disabled){background:var(--line);}
  .rename-sec{font-weight:800;font-size:13px;margin:12px 0 4px;}
  /* Nuovi stili per la gestione sezioni/attività */
  .rename-sec-wrap{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line);}
  .rename-sec-wrap:last-of-type{border-bottom:none;}
  .rename-sec-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .rename-sec-header input{height:38px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:14px;background:var(--card);color:var(--ink);}
  .rename-row.hidden-act{opacity:.6;}
  .add-act-form{display:flex;flex-direction:column;gap:0;margin-top:8px;padding:10px;background:var(--bg);border-radius:10px;border:1px solid var(--line);}
  .add-act-form input[type=text]{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:14px;background:var(--card);color:var(--ink);}
  .ol{font-size:13px;line-height:1.6;color:var(--ink);padding-left:18px;margin:6px 0 12px;}
  .ol b{font-weight:800;}
  a.link{color:#2563eb;font-weight:700;text-decoration:none;}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.4;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>📋 CDF Tracker</h1>
      <div class="title-right">
        <span class="overall" id="overall"></span>
        <span class="sync" id="syncBadge"><span class="dot off" id="syncDot"></span><span id="syncTxt">Sync</span></span>
        <button class="sync" id="themeToggle" aria-label="Cambia tema" style="border:0;cursor:pointer;">🌙</button>
      </div>
    </div>
    <div class="nav" id="navbar">
      <button class="arrow" id="prev" aria-label="Settimana precedente">‹</button>
      <div class="weeklabel" id="weeklabel"></div>
      <button class="arrow" id="next" aria-label="Settimana successiva">›</button>
      <button class="today-btn" id="todayBtn">Oggi</button>
    </div>
    <div class="tabs">
      <button class="tab active" role="tab" aria-selected="true" data-view="week" id="tabWeek">📅 Settimana</button>
      <button class="tab" role="tab" aria-selected="false" data-view="history" id="tabHistory">📊 Storico</button>
      <button class="tab icon" role="tab" aria-selected="false" data-view="settings" id="tabSettings">⚙️</button>
    </div>
  </header>

  <main id="weekView"></main>
  <main id="historyView" class="hidden"></main>
  <main id="settingsView" class="hidden"></main>

  <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  <div class="hint" id="footHint"></div>
</div>

<script>
"use strict";
const APP_VERSION = "1781671448";  // sostituito col timestamp ad ogni pubblicazione (auto-aggiornamento)

/* ===================== Tema (dark / light) ===================== */
const THEME_KEY = "cdfTheme";
function applyTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const dark = saved === "dark" || (saved !== "light" && prefersDark);
  document.documentElement.classList.toggle("dark", dark);
  document.documentElement.classList.toggle("light", !dark);
  const btn = document.getElementById("themeToggle");
  if(btn) btn.textContent = dark ? "☀️" : "🌙";
  const meta = document.querySelector("meta[name='theme-color']");
  if(meta) meta.setAttribute("content", dark ? "#0f172a" : "#f1f5f9");
}
applyTheme();

/* ===================== Sezioni e attività =====================
   Tipi di attività:
   - normale  -> 7 caselle (una al giorno)
   - weekly:true -> 1 sola casella per settimana
   - odd:true -> spuntabile solo nei giorni dispari del mese            */
const SECTIONS = [
  { id:"fisica", name:"Fisica & Benessere", emoji:"🏃", activities:[
    {id:"respiro",name:"Respiro"},{id:"schiena",name:"Schiena"},{id:"bagua",name:"Ba Gua"},
    {id:"trapz",name:"Tra pz e altro"},{id:"cfg",name:"CFG"},{id:"esyoga",name:"Es Yoga"},
    {id:"kf",name:"KF"},{id:"occhi",name:"Occhi"},{id:"perin",name:"Perin"},
    {id:"collo",name:"Collo"},{id:"polsi",name:"Polsi"},{id:"allungamento",name:"Allungamento"},
    {id:"seqex",name:"Seqex e P"}
  ]},
  { id:"autotrattamento", name:"Autotrattamento", emoji:"💆", activities:[
    {id:"at_p",name:"P"},{id:"at_s",name:"S"},{id:"at_focali",name:"Focali"},{id:"at_l",name:"L"}
  ]},
  { id:"lavoro", name:"Lavoro", emoji:"💼", activities:[
    {id:"indicazioni",name:"Indicazioni pz"},{id:"risprec",name:"Risp recensioni"},
    {id:"mail",name:"Mail importanti",odd:true},{id:"promemoria",name:"Promemoria"},
    {id:"ordinefile",name:"Ordine file"},{id:"foto",name:"Foto",odd:true},
    {id:"ripasso",name:"Ripasso"},{id:"enagic",name:"Enagic"},
    {id:"pagamenti",name:"Pagamenti",weekly:true}
  ]},
  { id:"corsi", name:"Corsi", emoji:"📚", activities:[
    {id:"argA",name:"Argomento A",day:0},{id:"argB",name:"Argomento B",day:1},
    {id:"argC",name:"Argomento C",day:2},{id:"argD",name:"Argomento D",day:3},
    {id:"argE",name:"Argomento E",day:4},{id:"argF",name:"Argomento F",day:5},{id:"argG",name:"Argomento G",day:6}
  ]}
];

const DEFAULT_LABEL = {};
SECTIONS.forEach(s=>s.activities.forEach(a=>DEFAULT_LABEL[a.id]=a.name));

const DAYS_SHORT = ["L","M","M","G","V","S","D"];
const MONTHS = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const STORAGE_KEY = "cdfTracker_v2";
const PANTRY_KEY  = "cdfPantryId";
const BASKET = "cdf";

/* ===================== Stato + persistenza locale ===================== */
let data = {};
try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){ data = {}; }
if(!data._labels)           data._labels = {};
if(!data._updatedAt)        data._updatedAt = 0;
if(!data._sectionNames)     data._sectionNames = {};     // { secId: {name,emoji} }
if(!data._customActivities) data._customActivities = {};  // { secId: [{id,name,...}] }
if(!data._hiddenActivities) data._hiddenActivities = {};  // { actId: true }

let pantryId = "";
try { pantryId = localStorage.getItem(PANTRY_KEY) || ""; } catch(e){}

function saveLocal(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch(e){ alert("Impossibile salvare in locale. Esci dalla navigazione privata."); }
}

/* ===================== Sincronizzazione (Pantry) ===================== */
let syncState = pantryId ? "ok" : "off";
let pushTimer = null;

function pantryUrl(){ return "https://getpantry.cloud/apiv1/pantry/"+encodeURIComponent(pantryId)+"/basket/"+BASKET; }
function setSync(s){ syncState=s; paintSync(); }
function paintSync(){
  const dot=document.getElementById("syncDot"), txt=document.getElementById("syncTxt");
  dot.className="dot "+syncState;
  txt.textContent = syncState==="ok"?"Sincronizzato":syncState==="saving"?"Salvataggio…":
                    syncState==="error"?"Errore sync":"Sync off";
}
async function pullRemote(){
  if(!pantryId) return undefined;
  try{
    const r = await fetch(pantryUrl(), {method:"GET", cache:"no-store"});
    if(r.status===400) return null;
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  }catch(e){ return "ERR"; }
}
/* Pantry aggiunge _metadata: lo togliamo dal nostro oggetto */
function stripMeta(o){ if(!o || typeof o!=="object") return o; const c=Object.assign({},o); delete c._metadata; return c; }
/* Unisce due versioni dei dati senza perdere nulla (nomi, ordine, spunte). */
function mergeData(local, remote){
  remote = stripMeta(remote);
  if(!remote || typeof remote!=="object") return local;
  if(!local) return remote;
  const localNewer = (local._updatedAt||0) >= (remote._updatedAt||0);
  const newer = localNewer?local:remote, older = localNewer?remote:local;
  const out = {};
  const weeks = {};
  Object.keys(local).concat(Object.keys(remote)).forEach(k=>{ if(!k.startsWith("_")) weeks[k]=1; });
  Object.keys(weeks).forEach(wk=>{
    const merged = {};
    const allActs = new Set(Object.keys(older[wk]||{}).concat(Object.keys(newer[wk]||{})));
    allActs.forEach(actId=>{
      const a=(older[wk]||{})[actId], b=(newer[wk]||{})[actId];
      if(!a){ merged[actId]=b; }
      else if(!b){ merged[actId]=a; }
      else{ merged[actId]=b.slice(); } // LWW: l'array più recente sovrascrive, per permettere di togliere le spunte
    });
    if(Object.keys(merged).length) out[wk]=merged;
  });
  out._labels          = Object.assign({}, older._labels||{},          newer._labels||{});
  out._sectionNames    = Object.assign({}, older._sectionNames||{},    newer._sectionNames||{});
  // _customActivities: per ogni sezione, union degli array; l'attività con stesso id viene presa dal più recente
  const allSecIds = new Set(Object.keys(older._customActivities||{}).concat(Object.keys(newer._customActivities||{})));
  const mergedCustom = {};
  allSecIds.forEach(sid=>{
    const oActs = (older._customActivities||{})[sid]||[];
    const nActs = (newer._customActivities||{})[sid]||[];
    const byId = {};
    oActs.forEach(a=>byId[a.id]=a);
    nActs.forEach(a=>byId[a.id]=a); // newer sovrascrive
    mergedCustom[sid] = Object.values(byId);
  });
  out._customActivities = mergedCustom;
  // _hiddenActivities: union (se uno nasconde, nasconde)
  out._hiddenActivities = Object.assign({}, older._hiddenActivities||{}, newer._hiddenActivities||{});
  out._order  = newer._order || older._order || {};
  out._updatedAt = Math.max(local._updatedAt||0, remote._updatedAt||0);
  return out;
}
function safeRender(){ const a=document.activeElement; if(a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA")) return; render(); }
function hasRealData(o){ return Object.keys(o||{}).some(k=>!k.startsWith("_") && o[k] && Object.values(o[k]).some(arr=>Array.isArray(arr)&&arr.some(Boolean))); }
async function doPush(){
  if(!pantryId) return;
  setSync("saving");
  try{
    const remote = await pullRemote();              // leggi-unisci-scrivi: non sovrascrivo il cloud
    if(remote && remote!=="ERR"){
      const before = JSON.stringify(data);
      data = mergeData(data, remote);
      if(JSON.stringify(data)!==before){ saveLocal(); safeRender(); }
    }
    const r = await fetch(pantryUrl(), {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
    setSync(r.ok ? "ok" : "error");
  }catch(e){ setSync("error"); }
}
function schedulePush(){
  if(!pantryId){ saveLocal(); return; }
  saveLocal(); setSync("saving");
  clearTimeout(pushTimer);
  pushTimer = setTimeout(doPush, 1200);
}
async function reconcile(){
  if(!pantryId){ setSync("off"); return; }
  const remote = await pullRemote();
  if(remote==="ERR"){ setSync("error"); return; }
  const before = JSON.stringify(data);
  data = mergeData(data, remote);
  if(!data._labels)           data._labels={};
  if(!data._sectionNames)     data._sectionNames={};
  if(!data._customActivities) data._customActivities={};
  if(!data._hiddenActivities) data._hiddenActivities={};
  // Ricarica i DEFAULT_LABEL con le attività custom sincronizzate
  for(const sec of SECTIONS){
    const customs=(data._customActivities&&data._customActivities[sec.id])||[];
    customs.forEach(a=>{ if(!DEFAULT_LABEL[a.id]) DEFAULT_LABEL[a.id]=a.name; });
  }
  if(JSON.stringify(data)!==before){ saveLocal(); safeRender(); }
  if(JSON.stringify(data)!==JSON.stringify(stripMeta(remote))) doPush();  // allinea il cloud al merge
  else setSync("ok");
}

/* ===================== Helper date ===================== */
function pad(n){ return String(n).length<2 ? "0"+n : ""+n; }
function fmtKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function getMonday(input){ const x=new Date(input); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function weekDates(monday){ const a=[]; for(let i=0;i<7;i++) a.push(addDays(monday,i)); return a; }

let viewMonday = getMonday(new Date());
let view = "week";

/* ===================== Colore rosso -> verde ===================== */
function gradColor(r){ r=Math.max(0,Math.min(1,r||0)); return "hsl("+Math.round(r*125)+",70%,45%)"; }

/* ===================== Accesso ai dati ===================== */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function actLabel(id){ return (data._labels && data._labels[id]) || DEFAULT_LABEL[id] || id; }

/* Restituisce {name, emoji} per una sezione (custom o default) */
function sectionLabel(sec){
  const ov = data._sectionNames && data._sectionNames[sec.id];
  return { name: (ov && ov.name) || sec.name, emoji: (ov && ov.emoji) || sec.emoji };
}

/* Tutte le attività di una sezione: built-in + custom */
function allActivities(sec){
  const customs = (data._customActivities && data._customActivities[sec.id]) || [];
  return sec.activities.concat(customs);
}

/* Attività ordinate; includeHidden=true per mostrare anche le nascoste (usato in settings) */
function orderedActivities(sec, includeHidden){
  const ord = (data._order && data._order[sec.id]) || [];
  const all = allActivities(sec);
  const byId = {}; all.forEach(a=>byId[a.id]=a);
  const hidden = data._hiddenActivities || {};
  const out = [];
  ord.forEach(id=>{ if(byId[id] && (includeHidden || !hidden[id])){ out.push(byId[id]); delete byId[id]; } });
  all.forEach(a=>{ if(byId[a.id] && (includeHidden || !hidden[a.id])) out.push(a); });
  return out;
}

function getCell(key, actId, day){ const w=data[key]; if(!w) return false; const a=w[actId]; return !!(a && a[day]); }
function setCell(key, actId, day, val){
  if(!data[key]) data[key]={};
  if(!data[key][actId]) data[key][actId]=[false,false,false,false,false,false,false];
  data[key][actId][day]=val;
  data._updatedAt = Date.now();
  schedulePush();
}

/* Quali indici-giorno sono "attivi" per questa attività in questa settimana */
function activeDays(act, monday){
  if(act.weekly) return [0];                       // una sola casella (indice 0)
  if(act.day!==undefined) return [act.day];        // un giorno fisso a settimana
  if(act.odd){ const ds=weekDates(monday); const out=[]; for(let i=0;i<7;i++) if(ds[i].getDate()%2===1) out.push(i); return out; }
  return [0,1,2,3,4,5,6];
}
function actStats(monday, act){
  const key=fmtKey(monday); const days=activeDays(act,monday);
  let done=0; for(const i of days) if(getCell(key,act.id,i)) done++;
  return {done, total:days.length, ratio: days.length? done/days.length : 0};
}
function sectionStats(monday, section){
  let done=0,total=0;
  for(const a of orderedActivities(section)){ const s=actStats(monday,a); done+=s.done; total+=s.total; }
  return {done,total,ratio: total?done/total:0};
}
function weekRatio(monday){
  let done=0,total=0;
  for(const sec of SECTIONS){ const s=sectionStats(monday,sec); done+=s.done; total+=s.total; }
  return total?done/total:0;
}
/* Totale per un singolo giorno (escludo le attività settimanali e i giorni non-applicabili) */
function dayStats(monday, i){
  const key=fmtKey(monday); const date=weekDates(monday)[i];
  let done=0,total=0;
  const hidden = data._hiddenActivities || {};
  for(const sec of SECTIONS) for(const a of allActivities(sec)){
    if(hidden[a.id]) continue;
    if(a.weekly) continue;
    if(a.day!==undefined && a.day!==i) continue;
    if(a.odd && date.getDate()%2===0) continue;
    total++; if(getCell(key,a.id,i)) done++;
  }
  return {done,total,ratio: total?done/total:0};
}
function pctTxt(p){ return Math.round(p*100)+"%"; }

/* ===================== Header ===================== */
function renderHeader(){
  const sun = addDays(viewMonday,6);
  const sameMonth = viewMonday.getMonth()===sun.getMonth();
  const label = sameMonth
    ? viewMonday.getDate()+" – "+sun.getDate()+" "+MONTHS[sun.getMonth()]
    : viewMonday.getDate()+" "+MONTHS[viewMonday.getMonth()]+" – "+sun.getDate()+" "+MONTHS[sun.getMonth()];
  document.getElementById("weeklabel").innerHTML = label + "<small>"+viewMonday.getFullYear()+"</small>";

  if(view==="week"){
    const r = weekRatio(viewMonday);
    document.getElementById("overall").innerHTML = 'Sett. <b style="color:'+gradColor(r)+'">'+pctTxt(r)+'</b>';
  } else document.getElementById("overall").innerHTML = "";

  const isThisWeek = fmtKey(viewMonday)===fmtKey(getMonday(new Date()));
  document.getElementById("todayBtn").classList.toggle("hidden", isThisWeek);
  document.getElementById("navbar").classList.toggle("hidden", view!=="week");

}

/* ===================== Vista settimana ===================== */
function renderWeek(){
  const key = fmtKey(viewMonday);

  let html = "";
  SECTIONS.forEach(s=>{
    const st = sectionStats(viewMonday, s);
    const col = gradColor(st.ratio);
    const sl = sectionLabel(s);
    html += '<section class="section">';
    html += '<div class="sec-head"><span class="sec-emoji">'+sl.emoji+'</span>'+
            '<span class="sec-name">'+esc(sl.name)+'</span>'+
            '<span class="sec-pct" style="color:'+col+'">'+pctTxt(st.ratio)+'</span></div>';
    html += '<div class="bar"><i style="width:'+(st.ratio*100)+'%;background:'+col+'"></i></div>';
    html += '<table><thead><tr><th class="lbl">Attività</th>';
    dates.forEach((dd,i)=>{ html += '<th class="'+(dd.today?'todaycol':'')+'">'+DAYS_SHORT[i]+'<span class="dnum">'+dd.d.getDate()+'</span></th>'; });
    html += '<th>%</th></tr></thead><tbody>';

    orderedActivities(s).forEach(a=>{
      const rs = actStats(viewMonday, a);
      const cellCol = (a.weekly || a.day!==undefined) ? gradColor(rs.ratio) : col;
      let tag = a.weekly ? '<span class="tag">1×/sett</span>'
              : (a.day!==undefined ? '<span class="tag">1×/sett · '+["Lun","Mar","Mer","Gio","Ven","Sab","Dom"][a.day]+'</span>'
              : (a.odd ? '<span class="tag">gg dispari</span>' : ''));
      html += '<tr><td class="lbl">'+esc(actLabel(a.id))+tag+'</td>';

      if(a.weekly){
        const on = getCell(key,a.id,0);
        const lbl = esc(actLabel(a.id))+', settimana '+viewMonday.getDate()+'-'+addDays(viewMonday,6).getDate();
        html += '<td colspan="7"><div class="weekcell"><button class="cell'+(on?' on':'')+'" '+
                (on?'style="background:'+cellCol+';border-color:'+cellCol+'" ':'')+
                'role="checkbox" aria-checked="'+(on?'true':'false')+'" aria-label="'+lbl+'" '+
                'data-act="'+a.id+'" data-day="0">✓</button><small>una volta a settimana</small></div></td>';
      } else {
        const actSet = activeDays(a, viewMonday);
        const DAYS_LONG = ["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
        for(let i=0;i<7;i++){
          if(actSet.indexOf(i)<0){ html += '<td class="'+(dates[i].today?'todaycol':'')+'"><span class="celldis" aria-hidden="true">·</span></td>'; continue; }
          const on = getCell(key,a.id,i);
          const cellLbl = esc(actLabel(a.id))+', '+DAYS_LONG[i]+' '+dates[i].d.getDate();
          html += '<td class="'+(dates[i].today?'todaycol':'')+'"><button class="cell'+(on?' on':'')+'" '+
                  (on?'style="background:'+cellCol+';border-color:'+cellCol+'" ':'')+
                  'role="checkbox" aria-checked="'+(on?'true':'false')+'" aria-label="'+cellLbl+'" '+
                  'data-act="'+a.id+'" data-day="'+i+'">✓</button></td>';
        }
      }
      html += '<td class="rowpct" style="color:'+gradColor(rs.ratio)+'">'+pctTxt(rs.ratio)+'</td></tr>';
    });
    html += '</tbody></table></section>';
  });
  document.getElementById("weekView").innerHTML = html;

  let dc = '<div class="daycard"><h3>Totale giornaliero</h3><div class="daygrid">';
  for(let i=0;i<7;i++){
    const ds = dayStats(viewMonday,i);
    dc += '<div class="d'+(dates[i].today?' is-today':'')+'"><div class="lab">'+DAYS_SHORT[i]+'</div>'+
          '<div class="ring" style="color:'+gradColor(ds.ratio)+'">'+pctTxt(ds.ratio)+'</div></div>';
  }
  dc += '</div></div>';
  document.getElementById("weekView").insertAdjacentHTML("afterbegin", dc);
}

/* ===================== Storico ===================== */
let historyOffset = 0;  // 0 = settimane recenti; -1 = 1 settimana indietro, ecc.
function lastMondaysOffset(n, offset){
  // offset = 0: finestra che termina questa settimana; offset = -1: termina 1 sett. fa
  const base = addDays(getMonday(new Date()), (offset)*7);
  const arr = [];
  for(let i=n-1;i>=0;i--) arr.push(addDays(base,-7*i));
  return arr;
}

function renderHistory(){
  const isAtNow = historyOffset === 0;
  const weeks6 = lastMondaysOffset(6, historyOffset);
  const lastW  = weeks6[weeks6.length-1];
  const firstW = weeks6[0];
  const rangeLabel = firstW.getDate()+'/'+(firstW.getMonth()+1)+' – '+lastW.getDate()+'/'+(lastW.getMonth()+1);

  // Barra di navigazione storico
  let nav = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">';
  nav += '<button class="arrow" id="histPrev" aria-label="Settimane precedenti" style="flex:0 0 auto">‹</button>';
  nav += '<div style="flex:1;text-align:center;font-weight:700;font-size:14px;">'+rangeLabel+'<br><small style="font-weight:500;color:var(--muted);font-size:11px;">'+firstW.getFullYear()+'</small></div>';
  nav += '<button class="arrow" id="histNext" aria-label="Settimane successive" '+(isAtNow?'disabled style="opacity:.3;cursor:default;"':'')+' style="flex:0 0 auto">›</button>';
  if(!isAtNow) nav += '<button class="today-btn" id="histToday" style="font-size:11px;height:36px;padding:0 10px;">Oggi</button>';
  nav += '</div>';

  let chart = '<div class="hcard"><h3>📊 Ultime 6 settimane</h3>'+nav+'<div class="chart">';
  weeks6.forEach(m=>{
    const p=weekRatio(m), h=Math.max(3,Math.round(p*100));
    chart += '<div class="col"><div class="colbar" style="height:'+h+'%;background:'+gradColor(p)+'"><span class="colpct">'+Math.round(p*100)+'</span></div><div class="collabel">'+m.getDate()+'/'+(m.getMonth()+1)+'</div></div>';
  });
  chart += '</div></div>';

  const weeks8 = lastMondaysOffset(8, historyOffset);
  const hasAny = hasRealData(data);
  let heat = '<div class="hcard"><h3>🗓️ Heatmap (completamento settimanale)</h3>';
  if(!hasAny){
    heat += '<div class="empty">Ancora nessun dato.<br>Inizia a segnare le attività nella vista “Settimana”.</div>';
  } else {
    heat += '<div class="hm-wrap"><table class="hm"><thead><tr><th class="lbl"></th>';
    weeks8.forEach(m=>{ heat += '<th>'+m.getDate()+'/'+(m.getMonth()+1)+'</th>'; });
    heat += '</tr></thead><tbody>';
    SECTIONS.forEach(s=>{
      const sl2 = sectionLabel(s);
      heat += '<tr class="sub"><td class="lbl">'+sl2.emoji+' '+esc(sl2.name)+'</td><td colspan="'+weeks8.length+'"></td></tr>';
      orderedActivities(s).forEach(a=>{
        heat += '<tr><td class="lbl">'+esc(actLabel(a.id))+'</td>';
        weeks8.forEach(m=>{ const st=actStats(m,a); const bg = st.done<=0 ? "var(--line)" : gradColor(st.ratio);
          heat += '<td><div class="swatch" style="background:'+bg+'">'+(st.done>0?st.done:"")+'</div></td>'; });
        heat += '</tr>';
      });
    });
    heat += '</tbody></table></div></div>';
  }
  document.getElementById("historyView").innerHTML = chart + heat;

  // Event listener frecce storico
  document.getElementById("histPrev").onclick = function(){ historyOffset--; renderHistory(); };
  const nextBtn = document.getElementById("histNext");
  if(nextBtn) nextBtn.onclick = function(){ if(historyOffset<0){ historyOffset++; renderHistory(); } };
  const todayBtn2 = document.getElementById("histToday");
  if(todayBtn2) todayBtn2.onclick = function(){ historyOffset=0; renderHistory(); };
}

function msg(id, text, kind){ document.getElementById(id).innerHTML = '<div class="status-msg '+kind+'">'+text+'</div>'; }

async function onSaveSync(){
  const v = document.getElementById("pantryInput").value.trim();
  if(!v){ msg("syncMsg","Incolla prima il codice Pantry.","err"); return; }
  pantryId = v; try{ localStorage.setItem(PANTRY_KEY, v); }catch(e){}
  msg("syncMsg","Verifica in corso…","info"); setSync("saving");
  const remote = await pullRemote();
  if(remote==="ERR"){ msg("syncMsg","❌ Codice non valido o niente connessione. Controlla e riprova.","err"); setSync("error"); return; }
  data = mergeData(data, remote);
  if(!data._labels)           data._labels={};
  if(!data._sectionNames)     data._sectionNames={};
  if(!data._customActivities) data._customActivities={};
  if(!data._hiddenActivities) data._hiddenActivities={};
  saveLocal(); render(); doPush();
  msg("syncMsg","✅ Collegato! Dati uniti e sincronizzati con il cloud.","ok");
  setSync("ok");
}
function onDiscSync(){
  if(!confirm("Disconnettere la sincronizzazione su questo dispositivo? I dati locali restano.")) return;
  pantryId=""; try{ localStorage.removeItem(PANTRY_KEY); }catch(e){}
  setSync("off"); renderSettings();
}
function collectNames(){
  document.querySelectorAll("#settingsView input[data-rid]").forEach(inp=>{
    const id=inp.getAttribute("data-rid"); const val=inp.value.trim();
    const defLabel = DEFAULT_LABEL[id] || (()=>{ for(const s of SECTIONS){ const c=(data._customActivities&&data._customActivities[s.id])||[]; const f=c.find(a=>a.id===id); if(f) return f.name; } return id; })();
    if(val && val!==defLabel) data._labels[id]=val; else delete data._labels[id];
  });
  // Salva nomi e emoji delle sezioni
  document.querySelectorAll("#settingsView input[data-sname]").forEach(inp=>{
    const sid=inp.getAttribute("data-sname"); const val=inp.value.trim();
    const sec=SECTIONS.find(s=>s.id===sid); if(!sec) return;
    if(!data._sectionNames) data._sectionNames={};
    if(!data._sectionNames[sid]) data._sectionNames[sid]={};
    if(val && val!==sec.name) data._sectionNames[sid].name=val; else delete data._sectionNames[sid].name;
  });
  document.querySelectorAll("#settingsView input[data-semoji]").forEach(inp=>{
    const sid=inp.getAttribute("data-semoji"); const val=inp.value.trim();
    const sec=SECTIONS.find(s=>s.id===sid); if(!sec) return;
    if(!data._sectionNames) data._sectionNames={};
    if(!data._sectionNames[sid]) data._sectionNames[sid]={};
    if(val && val!==sec.emoji) data._sectionNames[sid].emoji=val; else delete data._sectionNames[sid].emoji;
  });
}
function onSaveNames(){
  collectNames();
  data._updatedAt=Date.now(); schedulePush(); msg("nameMsg","✅ Salvato.","ok");
}
function addCustomActivity(sid){
  const nameEl = document.getElementById("addName_"+sid);
  const typeEl = document.getElementById("addType_"+sid);
  const dayEl  = document.getElementById("addDay_"+sid);
  const name = nameEl ? nameEl.value.trim() : "";
  if(!name){ alert("Inserisci un nome per l'attività."); return; }
  const type = typeEl ? typeEl.value : "normal";
  const actDef = { id: "cust_"+Date.now(), name };
  if(type==="weekly") actDef.weekly=true;
  else if(type==="odd") actDef.odd=true;
  else if(type==="day") actDef.day=parseInt(dayEl.value,10);
  if(!data._customActivities) data._customActivities={};
  if(!data._customActivities[sid]) data._customActivities[sid]=[];
  data._customActivities[sid].push(actDef);
  DEFAULT_LABEL[actDef.id]=actDef.name;
  data._updatedAt=Date.now(); schedulePush(); renderSettings();
  msg("nameMsg","✅ Attività \u201c"+name+"\u201d aggiunta.","ok");
}
function deleteCustomActivity(sid, actId){
  if(!confirm('Eliminare questa attività? Le spunte passate restano salvate.')) return;
  if(!data._customActivities||!data._customActivities[sid]) return;
  data._customActivities[sid]=data._customActivities[sid].filter(a=>a.id!==actId);
  delete (data._labels||{})[actId];
  data._updatedAt=Date.now(); schedulePush(); renderSettings();
}
function toggleHideActivity(actId){
  if(!data._hiddenActivities) data._hiddenActivities={};
  if(data._hiddenActivities[actId]) delete data._hiddenActivities[actId];
  else data._hiddenActivities[actId]=true;
  data._updatedAt=Date.now(); schedulePush(); renderSettings();
}
function moveActivity(sectionId, actId, dir){
  collectNames();
  const sec = SECTIONS.find(s=>s.id===sectionId); if(!sec) return;
  const visible = orderedActivities(sec).map(a=>a.id); // solo visibili
  const idx = visible.indexOf(actId), j = idx+dir;
  if(idx<0 || j<0 || j>=visible.length) return;
  // ricostruisco l'ordine completo includendo le nascoste
  const full = orderedActivities(sec, true).map(a=>a.id);
  const fi = full.indexOf(actId), fj = full.indexOf(visible[j]);
  if(fi<0||fj<0) return;
  const t=full[fi]; full[fi]=full[fj]; full[fj]=t;
  data._order = data._order || {}; data._order[sectionId] = full;
  data._updatedAt = Date.now(); schedulePush(); renderSettings();
}
function onResetNames(){
  if(!confirm("Ripristinare tutti i nomi predefiniti? (nomi sezioni, attività built-in; le attività custom restano)")) return;
  data._labels={}; data._sectionNames={}; data._updatedAt=Date.now(); schedulePush(); renderSettings();
  msg("nameMsg","Nomi ripristinati.","info");
}

/* ===================== Esporta / Importa ===================== */
function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download="cdf-tracker-backup-"+fmtKey(new Date())+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.getElementById("importFile").addEventListener("change", function(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const incoming=JSON.parse(ev.target.result);
      if(typeof incoming!=="object"||incoming===null) throw new Error();
      if(!confirm("Unire questo backup con i dati attuali?\nLe spunte di entrambi verranno mantenute (nessun dato recente viene perso).")) return;
      data = mergeData(data, incoming);
      if(!data._labels) data._labels={};
      data._updatedAt = Date.now();
      saveLocal(); schedulePush(); render();
      alert("Backup unito ai dati attuali.");
    }catch(err){ alert("File non valido."); }
  };
  reader.readAsText(file); e.target.value="";
});

/* ===================== Render principale ===================== */
function render(){
  renderHeader();
  document.getElementById("weekView").classList.toggle("hidden", view!=="week");
  document.getElementById("historyView").classList.toggle("hidden", view!=="history");
  document.getElementById("settingsView").classList.toggle("hidden", view!=="settings");
  document.getElementById("footHint").innerHTML = (view==="settings") ? "" :
    "I dati sono salvati su questo dispositivo" + (pantryId? " e sincronizzati nel cloud." : ". Attiva la sincronizzazione in ⚙️ per condividerli tra Mac e iPhone.");
  if(view==="week") renderWeek();
  else if(view==="history") renderHistory();
  else renderSettings();
}

/* ===================== Eventi ===================== */
document.getElementById("weekView").addEventListener("click", function(e){
  const btn=e.target.closest(".cell"); if(!btn || !btn.dataset.act) return;
  const key=fmtKey(viewMonday), actId=btn.dataset.act, day=parseInt(btn.dataset.day,10);
  setCell(key, actId, day, !getCell(key,actId,day));
  render();
});
document.getElementById("settingsView").addEventListener("click", function(e){
  const b=e.target.closest(".movebtn"); if(!b || b.disabled) return;
  moveActivity(b.dataset.msec, b.dataset.mact, parseInt(b.dataset.mdir,10));
});
document.getElementById("prev").onclick=()=>{ viewMonday=addDays(viewMonday,-7); render(); };
document.getElementById("next").onclick=()=>{ viewMonday=addDays(viewMonday,7); render(); };
document.getElementById("todayBtn").onclick=()=>{ viewMonday=getMonday(new Date()); render(); };
document.getElementById("syncBadge").onclick=()=>{ view="settings"; setTabs(); render(); };
document.getElementById("tabWeek").onclick=()=>{ view="week"; setTabs(); render(); };
document.getElementById("tabHistory").onclick=()=>{ view="history"; setTabs(); render(); };
document.getElementById("tabSettings").onclick=()=>{ view="settings"; setTabs(); render(); };
document.getElementById("themeToggle").onclick=function(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const currentlyDark = saved === "dark" || (saved !== "light" && prefersDark);
  try{ localStorage.setItem(THEME_KEY, currentlyDark ? "light" : "dark"); }catch(e){}
  applyTheme();
};
function setTabs(){
  ["tabWeek","tabHistory","tabSettings"].forEach(function(id){
    const isActive = (id==="tabWeek" && view==="week") || (id==="tabHistory" && view==="history") || (id==="tabSettings" && view==="settings");
    document.getElementById(id).classList.toggle("active", isActive);
    document.getElementById(id).setAttribute("aria-selected", isActive ? "true" : "false");
  });
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && pantryId) reconcile(); });

/* ===================== Auto-aggiornamento ===================== */
/* All'apertura controlla se sul sito c'è una versione più recente e, in tal caso,
   ricarica automaticamente (con cache-buster) così Mac e iPhone restano aggiornati. */
async function checkUpdate(){
  try{
    const txt = await fetch(location.pathname + "?_cb=" + Date.now(), {cache:"no-store"}).then(r=>r.text());
    const m = txt.match(/APP_VERSION\s*=\s*"([^"]+)"/);
    if(m && m[1] && m[1] !== APP_VERSION && m[1] !== "1781671448" && !sessionStorage.getItem("cdfReloaded")){
      sessionStorage.setItem("cdfReloaded","1");
      location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
    }
  }catch(e){}
}

/* ===================== Avvio ===================== */
render();
if(pantryId) reconcile();
checkUpdate();
/* Registrazione Service Worker (solo su HTTPS — GitHub Pages) */
if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("/cdf-tracker/sw.js").catch(function(){});
}
