<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CDF Tracker">
<meta name="theme-color" content="#0f172a">
<title>CDF Tracker</title>
<!-- APP_VERSION = "1783171128" — serve ai client rimasti sulla vecchia versione monolitica:
     il loro checkUpdate() legge questa riga e forza il ricaricamento sulla nuova app. -->
<link rel="stylesheet" href="style.css?v=1783171128">
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>📋 CDF Tracker</h1>
      <div class="title-right">
        <span class="overall" id="overall"></span>
        <span class="sync" id="syncBadge"><span class="dot off" id="syncDot"></span><span id="syncTxt">Sync</span></span>
        <a class="sync" id="libBtn" href="esercizi/" aria-label="Libreria esercizi" title="Libreria esercizi" style="text-decoration:none;">📚</a>
        <button class="sync" id="themeToggle" aria-label="Cambia tema" style="border:0;cursor:pointer;">🌙</button>
      </div>
    </div>
    <div class="nav" id="navbar">
      <button class="arrow" id="prev" aria-label="Settimana precedente">‹</button>
      <div class="weeklabel" id="weeklabel"></div>
      <button class="arrow" id="next" aria-label="Settimana successiva">›</button>
      <button class="today-btn" id="todayBtn">Oggi</button>
    </div>
    <div class="tabs">
      <button class="tab active" role="tab" aria-selected="true" data-view="today" id="tabToday">☀️ Oggi</button>
      <button class="tab" role="tab" aria-selected="false" data-view="week" id="tabWeek">📅 Settimana</button>
      <button class="tab" role="tab" aria-selected="false" data-view="history" id="tabHistory">📊 Storico</button>
      <button class="tab icon" role="tab" aria-selected="false" data-view="settings" id="tabSettings">⚙️</button>
    </div>
  </header>

  <main id="todayView"></main>
  <main id="weekView" class="hidden"></main>
  <main id="historyView" class="hidden"></main>
  <main id="settingsView" class="hidden"></main>

  <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  <div class="hint" id="footHint"></div>
</div>

<script src="shared.js?v=1783171128"></script>
<script src="app.js?v=1783171128"></script>
</body>
</html>
