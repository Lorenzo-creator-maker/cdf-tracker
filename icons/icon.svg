<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- anello a 4 segmenti: i colori delle aree (Fisica, Autotrattamento, Lavoro, Corsi) -->
  <g fill="none" stroke-width="46" stroke-linecap="round">
    <circle cx="256" cy="256" r="152" stroke="#2f9e6f" stroke-dasharray="190 765" transform="rotate(-81 256 256)"/>
    <circle cx="256" cy="256" r="152" stroke="#e07b1a" stroke-dasharray="190 765" transform="rotate(9 256 256)"/>
    <circle cx="256" cy="256" r="152" stroke="#178fb8" stroke-dasharray="190 765" transform="rotate(99 256 256)"/>
    <circle cx="256" cy="256" r="152" stroke="#7c5cbf" stroke-dasharray="190 765" transform="rotate(189 256 256)"/>
  </g>
  <!-- spunta centrale -->
  <path d="M196 262 L240 306 L322 212" fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
